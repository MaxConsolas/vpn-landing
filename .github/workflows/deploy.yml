name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME_SUFFIX: vpn-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image metadata
        id: image
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME="ghcr.io/${OWNER_LC}/${IMAGE_NAME_SUFFIX}:latest"
          echo "image_name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets['NEXT_PUBLIC_API_URL'] }}
            NEXT_PUBLIC_HOST=${{ secrets['NEXT_PUBLIC_HOST'] }}
            SENTRY_AUTH_TOKEN=${{ secrets['SENTRY_AUTH_TOKEN'] }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          GHCR_USERNAME: ${{ secrets['GHCR_USERNAME'] }}
          GHCR_TOKEN: ${{ secrets['GHCR_TOKEN'] }}
          APP_ENV_FILE: ${{ secrets['APP_ENV_FILE'] }}
          SSH_DEPLOY_PATH: ${{ secrets['SSH_DEPLOY_PATH'] }}
        with:
          host: ${{ secrets['SSH_HOST'] }}
          username: ${{ secrets['SSH_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          port: 22
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,APP_ENV_FILE,SSH_DEPLOY_PATH
          script_stop: true
          script: |
            set -eu

            cd "${SSH_DEPLOY_PATH}"
            printf "%s" "${APP_ENV_FILE}" > .env.production
            printf "\nIMAGE_NAME=%s\n" "${IMAGE_NAME}" >> .env.production

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            docker compose pull
            docker compose up -d
