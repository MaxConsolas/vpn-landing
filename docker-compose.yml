services:
  web:
    image: ${IMAGE_NAME}
    env_file:
      - .env.production
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == homeserver
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vpn-landing.rule=Host(`iris.sandakov.space`)"
        - "traefik.http.routers.vpn-landing.entrypoints=websecure"
        - "traefik.http.routers.vpn-landing.tls.certresolver=letsencrypt"
        - "traefik.http.services.vpn-landing.loadbalancer.server.port=3000"

networks:
  default:
    external: true
    name: proxy
